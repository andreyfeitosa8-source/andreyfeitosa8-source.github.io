<!doctype html>
<html lang="pt-BR">

    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;

      <p><code>$ open página</code></p>
